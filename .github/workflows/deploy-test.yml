name: Deploy backend to test server

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-test-deployment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_SERVER_HOST: ${{ vars.TEST_SERVER_HOST }}
      TEST_SERVER_PORT: ${{ vars.TEST_SERVER_PORT || '22' }}
      TEST_SERVER_USER: ${{ vars.TEST_SERVER_USER }}
      TEST_DEPLOY_PATH: ${{ vars.TEST_DEPLOY_PATH }}
      TEST_SSH_PRIVATE_KEY: ${{ secrets.TEST_SSH_PRIVATE_KEY }}
      TEST_SSH_KNOWN_HOSTS: ${{ secrets.TEST_SSH_KNOWN_HOSTS }}
      DEPLOY_SHA: ${{ github.sha }}
    steps:
      - name: Check out deployment script
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Update and start backend over SSH
        shell: bash
        run: |
          set -Eeuo pipefail

          for name in TEST_SERVER_HOST TEST_SERVER_PORT TEST_SERVER_USER TEST_DEPLOY_PATH TEST_SSH_PRIVATE_KEY TEST_SSH_KNOWN_HOSTS; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing Actions variable or secret: $name"
              exit 1
            fi
          done
          [[ "$TEST_SERVER_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.:-]*$ ]]
          [[ "$TEST_SERVER_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]]
          [[ "$TEST_SERVER_PORT" =~ ^[0-9]{1,5}$ ]]
          (( 10#$TEST_SERVER_PORT >= 1 && 10#$TEST_SERVER_PORT <= 65535 ))
          [[ "$TEST_DEPLOY_PATH" == /* && "$TEST_DEPLOY_PATH" != / && "$TEST_DEPLOY_PATH" != *$'\n'* && "$TEST_DEPLOY_PATH" != *$'\r'* ]]
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]

          ssh_dir="$(mktemp -d "$RUNNER_TEMP/smartdiet-ssh.XXXXXX")"
          trap 'rm -rf -- "$ssh_dir"' EXIT
          printf '%s\n' "$TEST_SSH_PRIVATE_KEY" | tr -d '\r' > "$ssh_dir/key"
          printf '%s\n' "$TEST_SSH_KNOWN_HOSTS" | tr -d '\r' > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key" "$ssh_dir/known_hosts"
          ssh-keygen -y -P '' -f "$ssh_dir/key" > /dev/null

          # Quote arguments before passing them through the remote login shell.
          printf -v remote_command 'bash -s -- --deploy-dir %q --sync --revision %q' "$TEST_DEPLOY_PATH" "$DEPLOY_SHA"
          ssh -T -p "$TEST_SERVER_PORT" -i "$ssh_dir/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$ssh_dir/known_hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "$TEST_SERVER_USER@$TEST_SERVER_HOST" "$remote_command" < scripts/deploy-test.sh
