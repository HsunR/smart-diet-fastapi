# Standalone server configuration; do not merge with docker-compose.yml.
name: ${COMPOSE_PROJECT_NAME:-smartdiet-test}

services:
  caddy:
    image: caddy:2.11.7-alpine
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN in .env}
      IMAGES_DOMAIN: ${IMAGES_DOMAIN:?Set IMAGES_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      proxy:
        ipv4_address: ${CADDY_PROXY_IP:-172.30.88.2}
    depends_on:
      app:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:2019/config/']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # A separate network-free tool avoids taking the live Caddy's fixed IP.
  caddy-validate:
    image: caddy:2.11.7-alpine
    profiles: [tools]
    network_mode: none
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN in .env}
      IMAGES_DOMAIN: ${IMAGES_DOMAIN:?Set IMAGES_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    volumes:
      - ./caddy:/etc/caddy:ro
    command: [caddy, validate, --config, /etc/caddy/Caddyfile, --adapter, caddyfile]

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: smartdiet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: smartdiet
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U smartdiet -d smartdiet"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  app:
    image: smartdiet-test-api:${DEPLOY_SHA:-local}
    build:
      context: .
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        PIP_TIMEOUT: ${PIP_TIMEOUT:-60}
        PIP_RETRIES: ${PIP_RETRIES:-5}
    command:
      - sh
      - -c
      - alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips "$$FORWARDED_ALLOW_IPS"
    ports:
      - '127.0.0.1:${TEST_APP_PORT:-8000}:8000'
    environment:
      FORWARDED_ALLOW_IPS: ${CADDY_PROXY_IP:-172.30.88.2}
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN in .env}
      WECHAT_APPID: ${WECHAT_APPID:-}
      WECHAT_SECRET: ${WECHAT_SECRET:-}
      ALLOW_MOCK_LOGIN: ${ALLOW_MOCK_LOGIN:-false}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_VISION_MODEL: ${LLM_VISION_MODEL:-}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      DATABASE_URL: postgresql+asyncpg://smartdiet:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/smartdiet
      REDIS_URL: redis://redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_PREFIX: ${RATE_LIMIT_PREFIX:-smartdiet:test:ratelimit:v1}
      RATE_LIMIT_IP_PER_MINUTE: ${RATE_LIMIT_IP_PER_MINUTE:-300}
      RATE_LIMIT_USER_PER_MINUTE: ${RATE_LIMIT_USER_PER_MINUTE:-120}
      RATE_LIMIT_LOGIN_PER_MINUTE: ${RATE_LIMIT_LOGIN_PER_MINUTE:-20}
      RATE_LIMIT_ACCOUNT_PER_MINUTE: ${RATE_LIMIT_ACCOUNT_PER_MINUTE:-10}
      RATE_LIMIT_REGISTER_PER_HOUR: ${RATE_LIMIT_REGISTER_PER_HOUR:-5}
      RATE_LIMIT_UPLOAD_IMAGES_PER_MINUTE: ${RATE_LIMIT_UPLOAD_IMAGES_PER_MINUTE:-30}
      RATE_LIMIT_AI_PER_MINUTE: ${RATE_LIMIT_AI_PER_MINUTE:-6}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-smartdiet}
      MINIO_SECURE: 'false'
      MINIO_PUBLIC_URL: https://${IMAGES_DOMAIN:?Set IMAGES_DOMAIN in .env}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      IMAGE_URL_EXPIRE_SECONDS: ${IMAGE_URL_EXPIRE_SECONDS:-900}
    networks:
      - default
      - proxy
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, urllib.request;
          data = json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3));
          assert data.get('code') == 0 and (data.get('data') or {}).get('status') == 'ok'
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command:
      - /bin/sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --appendfsync everysec --maxmemory 256mb --maxmemory-policy noeviction
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - redis_data:/data
    restart: unless-stopped

  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
      - '127.0.0.1:${TEST_MINIO_PORT:-9002}:9000'
      - '127.0.0.1:${TEST_MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio_data:/data
    networks:
      - default
      - proxy
    restart: unless-stopped

networks:
  proxy:
    ipam:
      config:
        - subnet: ${CADDY_PROXY_SUBNET:-172.30.88.0/24}

volumes:
  pgdata:
  minio_data:
  redis_data:
  caddy_data:
  caddy_config:
